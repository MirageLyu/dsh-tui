# The dsh-tui bundle patch: the full-screen interactive terminal surface over
# dsh-base. It mounts no Host, HTTP server, Web runtime, or browser plugin.
# The runner row creates the session's agent itself (fresh, or resumed from
# `--resume`/`--continue`/`/resume`), the keyboard-backed prompt provider
# answers ask_user_question and plan reviews, and the same channel answers
# `approval/request` through the shared user-approval service.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live while the TUI runs.
- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# ── tui-only host rows ──────────────────────────────────────────────────────

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # The derived query index and projection-cache ladder behind `/resume`
    # (the same storage root the web surface uses, so either surface's
    # checkpoints serve both). The projection registry itself is a base-layer
    # row; only its durable cache and the storage ladder are TUI rows.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Terminal-multiplexer context, mounted only where a terminal exists.
    - id: tmux-context
      name: '@deepseek-ai/dsh-tmux-context'
      config:
        refreshIntervalMs: 900000

    # The keyboard-backed provider behind ask_user_question and the plan-mode
    # review.
    - id: tui-prompt
      name: '@deepseek-ai/dsh-tui/prompt'

    # The ask-user-question model tool the provider above answers.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # Ordinary provider for the parsed TUI flags. Its plugin-level injection
    # waits for cmdlineArgs; no launcher metadata or special row kind is needed.
    - id: tui-startup
      name: '@deepseek-ai/dsh-tui/startup'

    # The runner: creates or resumes the session's agent, then mounts the
    # full-screen channel over it. Reads its invocation from the ordinary
    # tuiStartup provider; absent one (embedders) it starts a fresh session.
    - id: tui-runner
      name: '@deepseek-ai/dsh-tui'
      inject: [tuiStartup]
      config:
        showReasoning: true
        maxToolOutputLines: 6

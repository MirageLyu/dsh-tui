name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # npm refuses prereleases on the default `latest` tag: rc versions
      # publish under `rc`, stable versions keep the default.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@miragelyu/dsh-tui@$VERSION" version >/dev/null 2>&1; then
            echo "already published: @miragelyu/dsh-tui@$VERSION"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            pnpm publish --access public --provenance --no-git-checks --tag rc
          else
            pnpm publish --access public --provenance --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Release pi-tui fork

on:
  push:
    tags: ['pi-tui-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Publish fork
        working-directory: vendor/pi-tui
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@miragelyu/pi-tui@$VERSION" version >/dev/null 2>&1; then
            echo "already published: @miragelyu/pi-tui@$VERSION"
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Bug report
description: Report incorrect or unexpected behavior
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: |
        `dsh --version` plus the installed TUI version. The profile lockfile has
        both: `cat $DSH_HOME/profiles/<name>/pnpm-lock.yaml` (or run
        `dsh plugin --profile <name> why @miragelyu/dsh-tui`).
      placeholder: dsh 0.1.0-rc.7 · @miragelyu/dsh-tui 0.1.0-rc.5
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Terminal and platform
      description: Terminal emulator, OS, and whether tmux/screen or another multiplexer is involved.
      placeholder: iTerm2 3.5, macOS 15, no tmux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest command sequence that reproduces the behavior.
      placeholder: |
        1. dsh plugin --profile tui add @miragelyu/dsh-tui
        2. dsh --profile tui
        3. type /status, press Enter
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen.
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What the TUI shows instead; attach a screenshot or terminal recording when the problem is visual.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: stderr output or boot diagnostics, if any.
      render: text

name: Feature request
description: Propose a new capability or interaction
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task or workflow is currently awkward or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The interaction or capability you want, in user-facing terms.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways the same goal could be reached, and why this one wins.
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: Anything this must explicitly NOT change (keybindings, existing commands, rendering contracts).
